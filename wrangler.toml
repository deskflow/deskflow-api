#:schema node_modules/wrangler/config-schema.json
name = "deskflow-api"
main = "src/index.ts"
compatibility_date = "2024-10-11"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[kv_namespaces]]
binding = "APP_VERSION"
id = "9eaad23626614bccaf775d1af0069a6c"

[[migrations]]
tag = "<v1>"
new_sqlite_classes = ["SlowKV", "VotesByIP"]

[[migrations]]
tag = "v2"
deleted_classes = ["SlowKV", "VotesByIP"]
